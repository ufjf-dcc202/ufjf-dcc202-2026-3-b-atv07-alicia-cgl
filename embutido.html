<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS embutido</title>
    <style>
        p {
            font-family: sans-serif;
        }
        em {
            color: red;
        }
        code {
            background-color: red;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main>
        <h1>dcc202 css embutido</h1>
        <p>voce pode aplicar estilo <em>embutido</em> para um elemento usando o atributo <code>sytle</code>.</p>
    
        <dl>
            <div>
                <dt><code>color</code></dt>
                <dd>altera a cor do texto.</dd>
            </div>

            <div>
                <dt><code>background-color</code></dt>
                <dd>altera a cor do fundo do elemento.</dd>
            </div>
        </dl>
    </main>
</body>
</html>
