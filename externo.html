<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS externo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>dcc202 css externo</h1>
        <p>voce pode aplicar estilo <em>externo</em> para várias páginas  usando o atributo <code>link</code> no <code>head</code>.</p>
    
        <dl>
            <div>
                <dt><code>color</code></dt>
                <dd>altera a cor do texto.</dd>
            </div>

            <div>
                <dt><code>background-color</code></dt>
                <dd>altera a cor do fundo do elemento.</dd>
            </div>
        </dl>
    </main>
</body>
